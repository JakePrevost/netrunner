<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Netrunner">
  <title>Netrunner</title>
  <style>
:root {
  --bg: #000;
  --green: #39ff88;
  --green-dim: #1a7a45;
  --brute: #ff3b5c;
  --crypto: #29e0ff;
  --spoof: #ffe83b;
  --magenta: #ff2bd6;
  --violet: #7b5cff;
  --yellow: #ffe83b;
  --text: #d8ffe8;
  --muted: #6fa88a;
  --panel: rgba(2, 14, 8, 0.82);
  --line: rgba(57, 255, 136, 0.35);
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Roboto Mono', monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; }
body { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }

#rain { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0.32; z-index: 0; }
#app {
  position: relative; z-index: 1;
  height: 100dvh; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
}
#app.shake { animation: shake 0.3s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

.label { font-size: 10px; letter-spacing: 0.12em; color: var(--muted); }
.bar { flex: 1; height: 8px; background: rgba(57, 255, 136, 0.12); border: 1px solid var(--line); position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--green); box-shadow: 0 0 10px var(--green); transition: width 0.3s; }

/* ---------- HUD ---------- */
.hud { display: flex; flex-direction: column; gap: 6px; }
.trace { display: flex; align-items: center; gap: 8px; }
.trace .val { font-size: 13px; min-width: 38px; text-align: right; }
.trace.warn .bar i { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }
.trace.danger .bar i { background: var(--brute); box-shadow: 0 0 12px var(--brute); }
.trace.danger .val { color: var(--brute); animation: blink 0.8s infinite; }
@keyframes blink { 50% { opacity: 0.4; } }
.meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); }
.icon-btn { width: 28px; height: 28px; border: 1px solid var(--line); color: var(--green); font-size: 14px; }

/* ---------- Enemies ---------- */
.enemies { flex: 1; display: grid; gap: 8px; align-items: center; padding: 10px 0 4px; min-height: 0; }
.enemies.count-1 { grid-template-columns: minmax(0, 200px); justify-content: center; }
.enemies.count-2 { grid-template-columns: repeat(2, 1fr); }
.enemies.count-3 { grid-template-columns: repeat(3, 1fr); }
.enemy {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 8px 4px; background: var(--panel); border: 1px solid var(--line);
  transition: transform 0.15s, border-color 0.15s, opacity 0.4s;
}
.enemy.targetable { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow), 0 0 18px rgba(255, 232, 59, 0.35); animation: target-pulse 1s infinite; }
@keyframes target-pulse { 50% { box-shadow: 0 0 0 1px var(--yellow), 0 0 4px rgba(255, 232, 59, 0.2); } }
.enemy.acting { transform: translateY(6px) scale(1.04); border-color: var(--brute); }
.enemy.dead { opacity: 0.25; filter: grayscale(1); }
.enemy.hit { animation: hit 0.3s; }
@keyframes hit { 0% { filter: brightness(3) hue-rotate(90deg); transform: translateX(-4px); } 50% { transform: translateX(4px); } 100% { filter: none; transform: none; } }
.intent-row { min-height: 18px; }
.intent { font-size: 12px; font-weight: 700; padding: 1px 6px; border: 1px solid currentColor; }
.intent.attack { color: var(--brute); }
.intent.trace { color: var(--crypto); }
.intent.shield { color: var(--green); }
.intent.charge { color: var(--yellow); animation: blink 1s infinite; }
.ename { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.layers { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; min-height: 20px; }
.layer { font-size: 10px; font-weight: 700; min-width: 22px; padding: 2px 4px; text-align: center; color: #000; }
.layer.brute { background: var(--brute); }
.layer.crypto { background: var(--crypto); }
.layer.spoof { background: var(--spoof); }
.layer.none { background: none; color: var(--muted); border: 1px dashed var(--muted); }
.core { width: 90%; height: 14px; border: 1px solid var(--line); position: relative; }
.core i { position: absolute; inset: 0 auto 0 0; background: var(--green-dim); transition: width 0.3s; }
.core span { position: relative; font-size: 10px; line-height: 12px; display: block; text-align: center; }
.statuses { display: flex; gap: 3px; min-height: 14px; }
.status { font-size: 9px; padding: 0 3px; border: 1px solid; }
.status.weak { color: var(--spoof); }
.status.worm { color: #b6ff3b; }

.weakto-row { min-height: 13px; }
.weakto { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; }
.weakto.brute { color: var(--brute); }
.weakto.crypto { color: var(--crypto); }
.weakto.spoof { color: var(--spoof); }
.weakto.core { color: var(--muted); }
.glyph { position: relative; }
.eff-badge {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); white-space: nowrap; z-index: 2;
  font-size: 13px; font-weight: 900; letter-spacing: 0.06em; padding: 3px 6px; background: #000; border: 1px solid currentColor;
  box-shadow: 0 0 12px currentColor; animation: pop-in 0.18s ease-out;
}
@keyframes pop-in { from { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
.eff-weak { color: #7dff6b; }
.eff-resist { color: var(--brute); }
.eff-neutral { color: var(--text); }
.eff-pierce { color: #fff; }
.m-eff { font-size: 10px; font-weight: 900; margin-left: auto; margin-right: 6px; padding: 0 4px; border: 1px solid currentColor; border-radius: 2px; }
.float.eff-pop { font-size: 13px; letter-spacing: 0.12em; }
.float.eff-pop.weak { color: #7dff6b; }
.float.eff-pop.resist { color: var(--brute); }
.float.eff-pop.pierce { color: #fff; }

/* Enemy art (drawn in ui/art.ts) */
.glyph { width: 100%; height: 118px; display: block; position: relative; }
.art-host, .art { width: 100%; height: 100%; display: block; }
.art svg { width: 100%; height: 100%; display: block; overflow: visible; }
.enemy.dead .art { filter: grayscale(1) brightness(0.6); }
.intent.replicate { color: var(--crypto); animation: blink 1s infinite; }
.enemies.count-4 { grid-template-columns: repeat(4, 1fr); }
.glitch-a { animation: ga 2.8s steps(1) infinite; }
.glitch-b { animation: gb 3.3s steps(1) infinite; }
@keyframes ga { 0%, 88% { transform: none; } 90% { transform: translate(-3px, 1px); } 94% { transform: translate(2px, 0); } }
@keyframes gb { 0%, 84% { transform: none; } 86% { transform: translate(3px, -1px); } 92% { transform: translate(-2px, 1px); } }

/* ---------- Log ---------- */
.log { min-height: 48px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; justify-content: flex-end; padding: 4px 2px; }
.log div:last-child { color: var(--text); }
.prompt { text-align: center; color: var(--yellow) !important; font-weight: 700; letter-spacing: 0.15em; animation: blink 1s infinite; }

/* ---------- Player ---------- */
.player { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border-top: 1px solid var(--line); margin: 0 -10px; padding: 10px; }
.stats { display: flex; flex-direction: column; gap: 6px; }
.integrity { display: flex; align-items: center; gap: 8px; }
.integrity .bar i { background: var(--magenta); box-shadow: 0 0 10px var(--magenta); }
.integrity .val { font-size: 13px; min-width: 52px; text-align: right; }
.stats .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
.block-val { color: var(--muted); }
.block-val.on { color: var(--green); font-weight: 700; }
.ram { display: flex; align-items: center; gap: 4px; }
.ram i { width: 14px; height: 14px; border: 1px solid var(--crypto); transform: skewX(-15deg); }
.ram i.on { background: var(--crypto); box-shadow: 0 0 8px var(--crypto); }
.pile { font-size: 10px; color: var(--muted); }

.ram-rate { font-size: 10px; color: var(--muted); margin-left: 4px; }

/* ---------- Deck slots (programs as hardware modules) ---------- */
.deck { border: 1px solid var(--line); background: linear-gradient(180deg, rgba(57, 255, 136, 0.05), transparent 40%); padding: 6px; position: relative; }
.deck-label { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.18em; color: var(--muted); margin: -2px 2px 6px; text-transform: uppercase; }
.slots { display: grid; gap: 5px; }
.slots.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.slots.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.module {
  position: relative; display: flex; flex-direction: column; gap: 3px; min-height: 66px; padding: 6px 6px 5px 9px; text-align: left;
  background: linear-gradient(90deg, var(--c) 0 3px, rgba(4, 14, 9, 0.92) 3px);
  border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 3px;
  transition: transform 0.12s, box-shadow 0.12s, opacity 0.2s;
}
.module:active:not(:disabled) { transform: scale(0.96); }
.module.selected { box-shadow: 0 0 0 2px var(--c), 0 0 18px var(--c); transform: translateY(-4px); background: linear-gradient(90deg, var(--c) 0 3px, rgba(255, 255, 255, 0.1) 3px); }
.module:disabled { opacity: 0.5; }
.module.cooling { opacity: 1; }
.module.cooling > :not(.m-cd) { opacity: 0.25; }
.m-led { position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
.module:disabled .m-led { background: #333; box-shadow: none; }
.m-head { display: flex; align-items: baseline; gap: 4px; padding-right: 8px; }
.m-icon { color: var(--c); font-size: 11px; }
.m-name { font-size: 11px; font-weight: 700; color: var(--c); line-height: 1.15; overflow-wrap: break-word; }
.m-text { font-size: 10px; line-height: 1.25; color: var(--text); flex: 1; }
.m-foot { display: flex; justify-content: space-between; font-size: 9px; color: var(--crypto); letter-spacing: 0.05em; }
.m-cdbase { color: var(--muted); }
.m-cd { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--yellow); letter-spacing: 0.06em; background: repeating-linear-gradient(135deg, rgba(0,0,0,0.0) 0 6px, rgba(255, 232, 59, 0.06) 6px 12px); }
.module.empty { display: grid; place-items: center; font-size: 9px; letter-spacing: 0.15em; color: var(--muted); background: none; border: 1px dashed var(--line); }
.module.full { opacity: 0.5; }
.module.big { min-height: 120px; padding: 10px 8px 8px 11px; }
.module.big .m-name { font-size: 13px; }
.module.big .m-text { font-size: 11px; }
.t-mod { --c: var(--magenta); }

.end-turn {
  height: 44px; border: 1px solid var(--green); color: var(--green); font-weight: 700; letter-spacing: 0.2em;
  background: rgba(57, 255, 136, 0.08);
}
.end-turn:disabled { opacity: 0.35; }
.end-turn:active:not(:disabled) { background: rgba(57, 255, 136, 0.25); }

/* ---------- Floating numbers ---------- */
.float {
  position: fixed; z-index: 50; transform: translate(-50%, 0); pointer-events: none;
  font-weight: 800; font-size: 18px; text-shadow: 0 0 8px currentColor, 0 2px 0 #000;
  animation: float-up 0.9s ease-out both;
}
.float.dmg { color: var(--brute); }
.float.good { color: var(--green); font-size: 14px; }
.float.crack { font-size: 12px; letter-spacing: 0.1em; }
.float.crack.brute { color: var(--brute); }
.float.crack.crypto { color: var(--crypto); }
.float.crack.spoof { color: var(--spoof); }
@keyframes float-up { to { transform: translate(-50%, -46px); opacity: 0; } }

/* ---------- Timing overlays ---------- */
.timing-overlay {
  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
  background: rgba(0, 0, 0, 0.62); backdrop-filter: blur(2px); animation: fade-in 0.12s;
  touch-action: none;
}
.timing-overlay.out { opacity: 0; transition: opacity 0.12s; }
@keyframes fade-in { from { opacity: 0; } }
.timing-card { width: min(92vw, 440px); padding: 18px 16px 22px; background: rgba(0, 10, 4, 0.95); border: 1px solid var(--line); text-align: center; position: relative; }
.timing-title { font-weight: 800; letter-spacing: 0.08em; font-size: 15px; margin-bottom: 4px; }
.timing-hint { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
.exploit .timing-title { color: var(--green); }
.block .timing-title { color: var(--brute); }

.exploit-bar { position: relative; height: 56px; border: 1px solid var(--line); overflow: hidden; background: #010a05; }
.exploit-code { position: absolute; inset: 0; font-size: 10px; line-height: 14px; color: var(--green-dim); word-break: break-all; padding: 0 2px; text-align: left; }
.exploit-zone { position: absolute; top: 0; bottom: 0; background: rgba(255, 232, 59, 0.22); border-left: 1px solid var(--yellow); border-right: 1px solid var(--yellow); }
.exploit-perfect { position: absolute; top: 0; bottom: 0; background: rgba(255, 232, 59, 0.55); box-shadow: 0 0 14px var(--yellow); }
.exploit-cursor { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; background: #fff; box-shadow: 0 0 10px #fff, 0 0 20px var(--green); left: 0; }

.block-arena { position: relative; height: 300px; display: grid; place-items: center; overflow: hidden; }
.block-arena > * { grid-area: 1 / 1; }
.block-target { border-radius: 50%; border: 3px solid var(--green); box-shadow: 0 0 16px var(--green), inset 0 0 12px rgba(57, 255, 136, 0.4); }
.block-core { font-size: 28px; color: var(--green); }
.block-packet { border-radius: 50%; border: 3px solid var(--brute); box-shadow: 0 0 18px var(--brute); width: 300px; height: 300px; }

.timing-result {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; pointer-events: none;
  font-size: clamp(28px, 10vw, 40px); font-weight: 900; letter-spacing: 0.08em; animation: pop 0.3s ease-out;
}
.timing-result.perfect { color: var(--yellow); text-shadow: 0 0 20px var(--yellow), 3px 0 var(--magenta), -3px 0 var(--crypto); }
.timing-result.good { color: var(--green); text-shadow: 0 0 16px var(--green); }
.timing-result.miss { color: var(--brute); text-shadow: 0 0 16px var(--brute); }
@keyframes pop { from { transform: translateY(-50%) scale(1.6); opacity: 0; } }

/* ---------- Title / panels (meatspace palette) ---------- */
.title-screen, .panel-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 20px; }
.title-art { padding: 28px 18px; background: var(--magenta); border: 3px solid #1b0b3a; box-shadow: 8px 8px 0 #1b0b3a, 8px 8px 0 3px var(--yellow); transform: rotate(-2deg); }
.logo {
  margin: 0; font-size: clamp(34px, 11vw, 56px); font-weight: 900; letter-spacing: 0.06em; color: var(--yellow);
  text-shadow: 3px 3px 0 #1b0b3a; position: relative;
}
.logo::after { content: attr(data-text); position: absolute; left: 2px; top: 0; color: var(--crypto); mix-blend-mode: screen; clip-path: inset(40% 0 45% 0); animation: glitch 2.5s infinite steps(1); }
@keyframes glitch { 0%, 90% { transform: none; } 92% { transform: translateX(-6px); } 95% { transform: translateX(5px); } 98% { transform: translateX(-2px); } }
.tagline { font-size: 11px; color: #1b0b3a; font-weight: 700; letter-spacing: 0.2em; margin-top: 6px; }
.pitch { color: var(--text); font-size: 13px; max-width: 300px; line-height: 1.5; }
.primary {
  min-width: 200px; height: 52px; padding: 0 24px; background: var(--yellow); color: #1b0b3a; font-weight: 900; letter-spacing: 0.25em;
  box-shadow: 4px 4px 0 var(--magenta); border: 2px solid #1b0b3a;
}
.primary:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--magenta); }
.primary.small { min-width: 140px; height: 42px; }
.link { color: var(--muted); text-decoration: underline; font-size: 12px; padding: 8px; }
.settings { display: flex; flex-direction: column; gap: 8px; font-size: 12px; text-align: left; color: var(--muted); }
.settings input { accent-color: var(--green); width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }

.panel-screen h2 { margin: 0; font-size: 28px; letter-spacing: 0.12em; color: var(--green); text-shadow: 0 0 14px var(--green); }
.panel-screen.lost h2 { color: var(--brute); text-shadow: 0 0 14px var(--brute); }
.panel-screen.won h2 { color: var(--yellow); text-shadow: 0 0 14px var(--yellow); }
.panel-screen p { margin: 0; font-size: 13px; line-height: 1.5; }
.panel-screen .sub { color: var(--muted); font-size: 11px; }
.rewards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }

/* ---------- Loot / loadout ---------- */
.deck-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; font-size: 11px; color: var(--muted); }
.deck-stats b { color: var(--text); }
.loadout-screen { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 8px 2px 4px; }
.loadout-screen h2 { margin: 0; text-align: center; font-size: 24px; letter-spacing: 0.15em; color: var(--green); text-shadow: 0 0 14px var(--green); }
.loadout-screen h3 { margin: 4px 0 0; font-size: 11px; letter-spacing: 0.2em; color: var(--muted); }
.loadout-screen .sub { margin: 0; text-align: center; font-size: 11px; color: var(--muted); }
.loadout-screen .primary { align-self: center; margin-top: auto; }
.chassis { border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
.chassis-name { text-align: center; font-weight: 800; letter-spacing: 0.2em; color: var(--crypto); text-transform: uppercase; }

/* ---------- Help ---------- */
.help-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, 0.75); display: grid; place-items: center; padding: 16px; }
.help-card { max-width: 420px; max-height: 90dvh; overflow: auto; background: rgba(0, 12, 6, 0.97); border: 1px solid var(--line); padding: 16px; font-size: 12px; line-height: 1.5; text-align: left; }
.help-card h3 { margin: 0 0 8px; color: var(--green); letter-spacing: 0.15em; }
.help-card p { margin: 0 0 10px; }
.help-card b { color: var(--yellow); }
.help-card .layer { display: inline-block; min-width: 18px; }
.help-card .primary { display: block; margin: 12px auto 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}

/* ---------- Run HUD (map and node screens) ---------- */
.run-hud { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.sector-name { font-size: 11px; letter-spacing: 0.12em; color: var(--green); font-weight: 700; }
.hud-bars { display: flex; flex-direction: column; gap: 5px; }
.hud-bars .integrity, .hud-bars .trace { display: flex; align-items: center; gap: 8px; }
.hud-bars .label { min-width: 66px; }
.hud-bars .val { font-size: 12px; min-width: 46px; text-align: right; }
.purse { display: flex; gap: 14px; font-size: 12px; flex-wrap: wrap; }
.purse .credits { color: var(--yellow); }
.purse .data { color: var(--crypto); }
.purse .alert { color: var(--brute); font-weight: 700; animation: blink 1s infinite; }

/* ---------- Map ---------- */
.map-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px 0; }
.map { width: 100%; max-height: 100%; }
.path { stroke-width: 1.5; }
.path.idle { stroke: rgba(57, 255, 136, 0.18); stroke-dasharray: 3 5; }
.path.taken { stroke: var(--green); stroke-width: 2.5; filter: drop-shadow(0 0 4px var(--green)); }
.path.open { stroke: var(--text); stroke-width: 2; stroke-dasharray: 6 4; animation: dash 0.8s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
.mlabel { font-size: 9px; letter-spacing: 0.1em; fill: var(--muted); font-family: var(--mono); }
.mnode.ahead, .mnode.passed { opacity: 0.45; }
.mnode.passed { opacity: 0.25; }
.mnode.visited { opacity: 0.6; }
.mnode.reachable { cursor: pointer; }
.mnode.reachable .mlabel, .mnode.here .mlabel { fill: var(--text); font-weight: 700; }
.mnode .pulse { stroke-width: 1.5; animation: node-pulse 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes node-pulse { from { transform: scale(0.7); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
.here-ring { animation: spin-slow 6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin-slow { to { transform: rotate(360deg); } }
.map-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; }
.prompt-small { font-size: 11px; color: var(--yellow); letter-spacing: 0.1em; text-transform: uppercase; animation: blink 1.4s infinite; }
.secondary {
